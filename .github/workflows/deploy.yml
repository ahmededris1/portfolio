name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs, as in GitHub's own Pages template: package the site, then
  # publish it. Doing both in one job let the publish step ask for the
  # package before GitHub had finished registering it ("No artifacts named
  # github-pages were found"), even though the upload had succeeded.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pages must be set to build from "GitHub Actions" once, under
      # Settings -> Pages -> Source. Already done for this repository; a fork
      # would need it again, because creating a Pages site needs admin rights
      # that the automatic GITHUB_TOKEN does not carry.
      - uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
