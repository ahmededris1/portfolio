<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!--
    ==========================================================
    PAGE INFO  (edit the text between the quotes to suit you)
    ==========================================================
    These lines control the browser tab title and how the site
    looks when shared on social media or found in a search.
  -->
  <title>Ahmed Edris — Interactive Designer</title>
  <meta name="description" content="Portfolio of Ahmed Edris, an interactive product designer crafting calm, human-centred digital experiences.">
  <meta name="author" content="Ahmed Edris">
  <meta name="theme-color" content="#1c3a52">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://ahmededris1.github.io/portfolio/">

  <!-- Social sharing preview (Open Graph + Twitter).
       The image URL has to be absolute: Facebook, LinkedIn, WhatsApp and X
       all fetch it from their own servers, where a relative path means
       nothing. If the site ever moves to another domain, update the three
       URLs here, the one in <link rel="canonical"> above, and the two in
       robots.txt / sitemap.xml. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ahmed Edris">
  <meta property="og:title" content="Ahmed Edris — Interactive Designer">
  <meta property="og:description" content="Portfolio of Ahmed Edris, an interactive product designer.">
  <meta property="og:url" content="https://ahmededris1.github.io/portfolio/">
  <meta property="og:image" content="https://ahmededris1.github.io/portfolio/images/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Ahmed Edris — Interactive Designer">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://ahmededris1.github.io/portfolio/images/social-preview.png">

  <!-- Small icon shown in the browser tab, and on an iPhone home screen -->
  <link rel="icon" href="pika.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <!-- Fonts. The stylesheet is fetched without blocking the first paint:
       the browser draws the text in a system font straight away and swaps
       in Fraunces / Space Grotesk the moment they arrive. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Space+Grotesk:wght@400;500;700&display=swap">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Space+Grotesk:wght@400;500;700&display=swap"></noscript>

  <!-- The first project's cover is the biggest thing on the opening screen.
       JavaScript applies it as a background, which the browser cannot see
       until the scripts have run, so it is announced here instead.
       If you reorder the projects in data/projects.js, point this at the new
       first project's "img". Getting it wrong costs one wasted download —
       it will not break anything. -->
  <link rel="preload" as="image" href="images/scb-hero.webp" fetchpriority="high">

  <!-- The look of the site lives in this file -->
  <link rel="stylesheet" href="css/styles.css?v=5">

  <!--
    Structured data. This tells Google, LinkedIn and Bing who the site
    belongs to, rather than leaving them to guess from the page text. It is
    what lets a search for the name show the right role, photo and links.

    It repeats a few facts from data/projects.js on purpose: search engines
    read this from the raw HTML, before any JavaScript runs. If the name,
    role, location, employer or social links change, change them here too.
    Validate any edit at https://validator.schema.org
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfilePage",
    "mainEntity": {
      "@type": "Person",
      "name": "Ahmed Edris",
      "jobTitle": "Senior Product Designer",
      "description": "Interactive product designer working on banking, telecom and government products.",
      "url": "https://ahmededris1.github.io/portfolio/",
      "image": "https://ahmededris1.github.io/portfolio/images/social-preview.png",
      "email": "mailto:ahemdharvoc@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Riyadh",
        "addressCountry": "SA"
      },
      "worksFor": { "@type": "Organization", "name": "Tahakom" },
      "knowsAbout": [
        "Product design",
        "Interaction design",
        "UX research",
        "Design systems",
        "Prototyping",
        "Usability testing",
        "Information architecture",
        "Accessibility"
      ],
      "sameAs": [
        "https://www.linkedin.com/in/ahmed-edris1/",
        "https://www.behance.net/ahmededris1",
        "https://github.com/ahmededris1"
      ]
    }
  }
  </script>
</head>
<body>

  <!-- Lets keyboard users jump straight to the content -->
  <a class="skip-link" href="#reel">Skip to content</a>

  <!-- Opening animation. It hides itself automatically. -->
  <div id="intro" aria-hidden="true"><div class="mark" id="introMark"></div></div>

  <!-- Top bar: logo on the left, About link on the right.
       The inner wrapper keeps the logo and nav lined up with the page
       content on very wide screens. -->
  <header>
    <div class="header-inner">
      <a class="logo" id="logo" href="#reel" aria-label="Ahmed Edris, back to top"></a>
      <nav class="site-nav" aria-label="Primary">
        <button class="navlink" id="aboutLink" type="button">About</button>
      </nav>
    </div>
  </header>

  <!-- Page heading for screen readers and search engines (kept off-screen) -->
  <h1 class="visually-hidden">Ahmed Edris — Interactive Designer portfolio</h1>

  <!-- The project screens are added here automatically from data/projects.js -->
  <main id="reel" tabindex="-1"></main>

  <!-- Dots down the right edge that jump to each project -->
  <nav id="dots" aria-label="Project navigation"></nav>

  <!-- Full-screen case study. It stays hidden until a project is opened. -->
  <div id="case" role="dialog" aria-modal="true" aria-labelledby="csTitle" inert>
    <button class="cs-close" id="caseClose" type="button" aria-label="Close case study" title="Close (Esc)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>

    <div class="cs-hero">
      <h2 class="cs-title" id="csTitle"></h2>
      <div class="cs-figure"><div class="art" id="csArt" aria-hidden="true"></div></div>
      <button class="cs-scroll" id="csScroll" type="button" aria-label="Scroll to project details">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      </button>
    </div>

    <div class="cs-body">
      <div class="cs-meta" id="csMeta"></div>

      <!-- Rich, per-project long-scroll case study (filled from data/projects.js) -->
      <div id="csStory"></div>

      <!-- Simple fallback for projects that have no "story" array -->
      <div id="csDefault">
        <h3>Overview</h3>
        <p id="csOverview"></p>
        <h3>The work</h3>
        <p id="csWork"></p>
      </div>

      <!-- Previous / Next project navigation (shown on every project) -->
      <div id="csNav"></div>
    </div>
  </div>

  <!-- Full-screen About page. Opens from the "About" nav link and stays hidden
       until then. Its contents — including the "Back" button that closes it —
       are built by js/main.js from the `about` block in data/projects.js. -->
  <div id="about" role="dialog" aria-modal="true" aria-labelledby="aboutTitle" inert>
    <div id="aboutBody"></div>
  </div>

  <!-- Shown only if JavaScript is turned off -->
  <noscript>
    <div class="noscript">
      <h2>Ahmed Edris — Interactive Designer</h2>
      <p>This portfolio needs JavaScript enabled to show its interactive reel.</p>
      <p>You can still reach me at <a href="mailto:ahemdharvoc@gmail.com">ahemdharvoc@gmail.com</a>.</p>
    </div>
  </noscript>

  <!--
    Scripts load in this order:
    1) projects.js  = your content (safe to edit)
    2) main.js      = the behaviour (no need to edit)
  -->
  <script src="data/projects.js?v=5"></script>
  <script src="js/main.js?v=5"></script>
</body>
</html>
